    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: pip
    directory: /tools/finviz
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    ignore:
      # major は自動 PR にしない。next 15->16 や typescript 5->7 のような破壊的変更が
      # 週次で大量に積まれると、結局「通知が多すぎて誰も見ない」状態に戻るため。
      # なお major にしか修正が無い脆弱性は Dependabot security updates 側から
      # この ignore に関係なく PR が立つので、セキュリティ追従は落ちない。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"

  # --- Docker ベースイメージ ---
  - package-ecosystem: docker
    directories:
      - /api-go
      - /app/backend
      - /app/batch
      - /app/frontend
      - /app/admin-frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # major は自動 PR にしない。next 15->16 や typescript 5->7 のような破壊的変更が
      # 週次で大量に積まれると、結局「通知が多すぎて誰も見ない」状態に戻るため。
      # なお major にしか修正が無い脆弱性は Dependabot security updates 側から
      # この ignore に関係なく PR が立つので、セキュリティ追従は落ちない。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"

  # --- GitHub Actions (SHA pin 済のため digest 追従が要る) ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # major は自動 PR にしない。next 15->16 や typescript 5->7 のような破壊的変更が
      # 週次で大量に積まれると、結局「通知が多すぎて誰も見ない」状態に戻るため。
      # なお major にしか修正が無い脆弱性は Dependabot security updates 側から
      # この ignore に関係なく PR が立つので、セキュリティ追従は落ちない。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci(deps)"
