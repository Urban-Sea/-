# 依存の脆弱性追従を自動化する設定。
# 2026-07 に Trivy 指摘を全消化したあと 2 ヶ月で CRITICAL 1 / HIGH 17 が再蓄積したため、
# 「検出 (security-scan.yml) だけあって追従がない」状態を埋める目的で追加。
version: 2
updates:
  # --- Go (api-go) ---
  - package-ecosystem: gomod
    directory: /api-go
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # major は自動 PR にしない。next 15->16 や typescript 5->7 のような破壊的変更が
      # 週次で大量に積まれると、結局「通知が多すぎて誰も見ない」状態に戻るため。
      # なお major にしか修正が無い脆弱性は Dependabot security updates 側から
      # この ignore に関係なく PR が立つので、セキュリティ追従は落ちない。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # --- npm (frontend / admin-frontend) ---
  - package-ecosystem: npm
    directory: /app/frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    ignore:
      # major は自動 PR にしない。next 15->16 や typescript 5->7 のような破壊的変更が
      # 週次で大量に積まれると、結局「通知が多すぎて誰も見ない」状態に戻るため。
      # なお major にしか修正が無い脆弱性は Dependabot security updates 側から
      # この ignore に関係なく PR が立つので、セキュリティ追従は落ちない。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app/admin-frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    ignore:
      # major は自動 PR にしない。next 15->16 や typescript 5->7 のような破壊的変更が
      # 週次で大量に積まれると、結局「通知が多すぎて誰も見ない」状態に戻るため。
      # なお major にしか修正が無い脆弱性は Dependabot security updates 側から
      # この ignore に関係なく PR が立つので、セキュリティ追従は落ちない。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # --- pip (backend / batch / finviz ツール) ---
  - package-ecosystem: pip
    directory: /app/backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # major は自動 PR にしない。next 15->16 や typescript 5->7 のような破壊的変更が
      # 週次で大量に積まれると、結局「通知が多すぎて誰も見ない」状態に戻るため。
      # なお major にしか修正が無い脆弱性は Dependabot security updates 側から
      # この ignore に関係なく PR が立つので、セキュリティ追従は落ちない。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: pip
    directory: /app/batch
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # major は自動 PR にしない。next 15->16 や typescript 5->7 のような破壊的変更が
      # 週次で大量に積まれると、結局「通知が多すぎて誰も見ない」状態に戻るため。
      # なお major にしか修正が無い脆弱性は Dependabot security updates 側から
