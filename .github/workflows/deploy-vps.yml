name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'api-go/**'
      - 'nginx/**'
      - 'db/**'
      - 'scripts/**'
      - 'docker-compose.prod.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

# 既定は最小権限 (空)。各ジョブで必要な分だけ付与する
permissions: {}

jobs:
  # ─── Job 1: Detect which services changed ───
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api-python: ${{ steps.filter.outputs.api-python }}
      api-go: ${{ steps.filter.outputs.api-go }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
      batch: ${{ steps.filter.outputs.batch }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            api-python:
              - 'app/backend/**'
            api-go:
              - 'api-go/**'
            frontend:
              - 'app/frontend/**'
            admin:
              - 'app/admin-frontend/**'
            batch:
              - 'app/batch/**'
              - 'app/backend/analysis/**'
            infra:
              - 'docker-compose.prod.yml'
              - 'nginx/**'
              - 'db/**'
              - 'scripts/**'

      # workflow_dispatch → build all
      - name: Force all on manual trigger
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: echo "all=true" >> "$GITHUB_OUTPUT"

  # ─── Job 2: Build images (only changed ones) ───
  build-api-python:
    name: Build api-python
    needs: detect-changes
    if: needs.detect-changes.outputs.api-python == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image
        run: docker build -t open-regime-api-python:latest ./app/backend
      - name: Save and compress
        run: docker save open-regime-api-python:latest | gzip > open-regime-api-python.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-api-python
          path: open-regime-api-python.tar.gz
          retention-days: 1

  build-api-go:
    name: Build api-go
    needs: detect-changes
    if: needs.detect-changes.outputs.api-go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image
        run: docker build -t open-regime-api-go:latest ./api-go
      - name: Save and compress
        run: docker save open-regime-api-go:latest | gzip > open-regime-api-go.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-api-go
          path: open-regime-api-go.tar.gz
          retention-days: 1

  build-frontend:
    name: Build frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image
        run: docker build -t open-regime-frontend:latest ./app/frontend
      - name: Save and compress
        run: docker save open-regime-frontend:latest | gzip > open-regime-frontend.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-frontend
          path: open-regime-frontend.tar.gz
          retention-days: 1

  build-admin:
    name: Build admin
    needs: detect-changes
    if: needs.detect-changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image
        run: docker build -t open-regime-admin:latest ./app/admin-frontend
      - name: Save and compress
        run: docker save open-regime-admin:latest | gzip > open-regime-admin.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-admin
          path: open-regime-admin.tar.gz
          retention-days: 1

  build-batch:
    name: Build batch
    needs: detect-changes
    if: needs.detect-changes.outputs.batch == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image
        run: docker build -t open-regime-batch:latest -f app/batch/Dockerfile .
      - name: Save and compress
        run: docker save open-regime-batch:latest | gzip > open-regime-batch.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-batch
          path: open-regime-batch.tar.gz
          retention-days: 1

  # ─── Job 3: Deploy to VPS ───
  deploy:
    name: Deploy to VPS
    needs: [detect-changes, build-api-python, build-api-go, build-frontend, build-admin, build-batch]
    if: |
      !failure() && !cancelled() && (
        needs.build-api-python.result == 'success' ||
        needs.build-api-go.result == 'success' ||
        needs.build-frontend.result == 'success' ||
        needs.build-admin.result == 'success' ||
        needs.build-batch.result == 'success' ||
        needs.detect-changes.outputs.infra == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Download all image artifacts (only those that exist)
      - name: Download image artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          merge-multiple: true
          path: ./images
        continue-on-error: true

      # SCP infrastructure files
      - name: Transfer infra files
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/,db/init/,scripts/"
          target: /opt/open-regime
          overwrite: true

      # SCP image tar.gz files (if any were built)
      - name: Transfer images
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        if: hashFiles('images/*.tar.gz') != ''
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "images/"
          target: /opt/open-regime
          overwrite: true

      # SSH: load images, deploy, health check
      - name: Deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/open-regime

            # Save old image IDs for rollback
            for img in api-python api-go frontend admin batch; do
              docker inspect "open-regime-$img:latest" --format='{{.Id}}' 2>/dev/null > "/tmp/old-$img-id" || true
            done

            # Load new images (if any tar.gz exist)
            for f in images/*.tar.gz; do
              [ -f "$f" ] && gunzip -c "$f" | docker load && echo "Loaded: $f"
            done

            # Deploy
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --pull never

            # Health check with retry (max 60s)
            #
            # 旧実装は http://localhost/health を見ていたが、:80 の server ブロックは
            # 301 を返すだけなので「nginx が起動している」以上のことを何も保証しておらず、
            # frontend / api-go が死んでいてもデプロイが success になっていた (Q6 監査 M18)。
            # https + Host ヘッダで実際の経路を 3 点確認する:
            #   1. nginx        -> /health が 200 'ok'
            #   2. frontend SSR -> / が 2xx (Next.js standalone が応答している)
            #   3. api-go       -> /api/auth/me が 401 (認証が効いた上でプロセス生存。502 なら死)
            echo "Waiting for health check..."
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -skf -H "Host: open-regime.com" https://localhost/health > /dev/null 2>&1 \
                 && curl -skf -o /dev/null -H "Host: open-regime.com" https://localhost/ \
                 && [ "$(curl -sk -o /dev/null -w '%{http_code}' -H 'Host: open-regime.com' https://localhost/api/auth/me)" = "401" ]; then
                HEALTHY=true
                echo "Health check passed (attempt $i): nginx + frontend + api-go"
                break
              fi
              echo "Attempt $i/30 failed, retrying in 2s..."
              sleep 2
            done

            if [ "$HEALTHY" = true ]; then
              rm -f images/*.tar.gz
              docker image prune -f
              echo "DEPLOY_STATUS=success" >> /tmp/deploy-result
            else
              echo "Health check failed after 30 attempts — rolling back"
              for img in api-python api-go frontend admin batch; do
                OLD_ID=$(cat "/tmp/old-$img-id" 2>/dev/null)
                [ -n "$OLD_ID" ] && docker tag "$OLD_ID" "open-regime-$img:latest"
              done
              docker compose -f docker-compose.prod.yml up -d --pull never
              echo "DEPLOY_STATUS=rollback" >> /tmp/deploy-result
              exit 1
            fi

  notify:
    name: Slack deploy notification
    needs: [deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set, skipping"
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = "success" ]; then
            COLOR="#36a64f"
            STATUS="Deploy succeeded"
          elif [ "$DEPLOY_RESULT" = "skipped" ]; then
            COLOR="#cccccc"
            STATUS="Deploy skipped (no changes)"
          else
            COLOR="#ff0000"
            STATUS="Deploy failed — rolled back"
          fi

          TITLE=$(echo "$COMMIT_MSG" | head -1)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(jq -n \
            --arg color "$COLOR" \
            --arg status "$STATUS" \
            --arg title "$TITLE" \
            --arg run_url "$RUN_URL" \
            '{
              attachments: [{
                color: $color,
                blocks: [
                  {
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: ("*" + $status + "*\n" + $title)
                    }
                  },
                  {
                    type: "actions",
                    elements: [
                      {
                        type: "button",
                        text: { type: "plain_text", text: "Workflow Run" },
                        url: $run_url
                      }
                    ]
                  }
                ]
              }]
            }')

          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true
